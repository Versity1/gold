{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Avalanch Metal - Authentication{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    
    <!-- Fonts - Manrope -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2d00d",
                        "primary-dark": "#d4af37",
                        "background-dark": "#0a0a0a",
                        "card-dark": "#161616",
                        "surface-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .gold-shimmer {
            background: linear-gradient(135deg, #f2d00d 0%, #d4af37 50%, #f2d00d 100%);
            background-size: 200% auto;
        }
        .glass-card {
            background: rgba(22, 22, 22, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
    <!-- Smartsupp Live Chat script -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = 'bc84a48ec1826210880f0fa5cb390c4218668da6';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
  s=d.getElementsByTagName('script')[0];c=d.createElement('script');
  c.type='text/javascript';c.charset='utf-8';c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
})(document);
</script>
<noscript> Powered by <a href="https://www.smartsupp.com" target="_blank">Smartsupp</a></noscript>
</head>
<body class="bg-background-dark text-white font-display min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/4 -left-32 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-primary/5 rounded-full blur-[120px]"></div>
    </div>
    
    <!-- Logo -->
    <a href="{% url 'home' %}" class="flex items-center gap-3 mb-8 relative z-10">
        <div class="size-12 bg-primary rounded-xl flex items-center justify-center text-background-dark shadow-[0_0_30px_rgba(242,208,13,0.3)]">
            <span class="material-symbols-outlined font-bold text-2xl">payments</span>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight uppercase">Gold<span class="text-primary">Invest</span></h1>
    </a>
    
    <!-- Content -->
    <div class="relative z-10 w-full max-w-md">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Footer -->
    <p class="text-xs text-slate-500 mt-8 relative z-10">
        © 2025 Avalanch Metal. All rights reserved.
    </p>
</body>
</html>
